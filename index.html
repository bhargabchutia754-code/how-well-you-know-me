<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>How Well You Know Me?</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #111827, #312e81, #581c87);
  color: white;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.container {
  width: 100%;
  max-width: 600px;
  background: rgba(255,255,255,0.10);
  backdrop-filter: blur(15px);
  border-radius: 25px;
  padding: 30px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.4);
  border: 1px solid rgba(255,255,255,0.15);
}

h1 {
  text-align: center;
  font-size: 34px;
  margin-bottom: 8px;
}

.subtitle {
  text-align: center;
  color: #d1d5db;
  margin-bottom: 25px;
}

.question {
  font-size: 21px;
  font-weight: bold;
  margin-bottom: 20px;
  line-height: 1.4;
}

.option {
  width: 100%;
  padding: 15px;
  margin: 10px 0;
  border: none;
  border-radius: 14px;
  background: rgba(255,255,255,0.12);
  color: white;
  font-size: 16px;
  text-align: left;
  cursor: pointer;
  transition: 0.25s;
}

.option:hover {
  background: rgba(255,255,255,0.22);
  transform: translateY(-2px);
}

.option.correct {
  background: #16a34a;
}

.option.wrong {
  background: #dc2626;
}

button {
  font-family: inherit;
}

.next {
  width: 100%;
  margin-top: 20px;
  padding: 15px;
  border: none;
  border-radius: 14px;
  background: #facc15;
  color: #111827;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

.next:hover {
  background: #fde047;
}

.progress {
  height: 8px;
  background: rgba(255,255,255,0.15);
  border-radius: 10px;
  margin-bottom: 25px;
  overflow: hidden;
}

.progress-bar {
  height: 100%;
  width: 0%;
  background: #facc15;
  transition: 0.3s;
}

.score {
  text-align: center;
  font-size: 26px;
  margin: 20px 0;
}

.result {
  text-align: center;
}

.result h2 {
  font-size: 30px;
}

.restart {
  width: 100%;
  padding: 15px;
  border: none;
  border-radius: 14px;
  background: #22c55e;
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

.share {
  width: 100%;
  padding: 15px;
  margin-top: 12px;
  border: none;
  border-radius: 14px;
  background: #3b82f6;
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}
